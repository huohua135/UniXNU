name: runner probe 2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: |
          uname -a
          sw_vers || true
          xcodebuild -version || true
